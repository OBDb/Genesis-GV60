    description: "Genesis's first dedicated electric model, a compact crossover on Hyundai Motor Group's E-GMP platform alongside the Hyundai IONIQ 5 and Kia EV6. It uses the platform's 800-volt battery system with rear- or all-wheel drive, and adds Genesis's own styling, a rotating crystal gear selector and face recognition entry. A facelift for the 2026 model year brought a larger battery."
